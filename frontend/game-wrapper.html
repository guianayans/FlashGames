<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* Overlay de carregamento (ver game-wrapper.ts, onProgress) — mesmo
         padrao visual do player desktop (Player.tsx/styles.css), so em
         CSS/DOM puro aqui (esta pagina nao usa React). A barra so anda de
         verdade pro PS1 (unico sistema com progresso real, ver
         loadEmulatorScript.ts) — nos outros fica parada em 0% ate sumir. */
      #loading-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: #050308;
        overflow: hidden;
      }
      #loading-overlay.hidden {
        display: none;
      }
      /* Area onde o icone anda (ver game-wrapper.ts, startWalkingIcon) —
         cobre o overlay inteiro; a posicao de verdade (x/y, ricochete nas
         bordas) e' calculada em JS a cada frame porque precisa medir o
         tamanho real do container (CSS puro nao tem como fazer colisao). */
      #loading-walk-area {
        position: absolute;
        inset: 0;
      }
      #loading-walk-sprite {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        will-change: transform;
      }
      /* Icone do console do jogo (ver game-wrapper.ts, setLoadingIcon). O
         "andar local" (passo balancando pra cima, sombra espremendo) e'
         so CSS; quem move o icone pela tela e faz ricochetear nas bordas
         e' o JS, que so translada o #loading-walk-sprite pai — os dois
         efeitos se somam. */
      #loading-icon-img {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
        filter: drop-shadow(0 0 8px #00e5ff);
        animation: loading-icon-bounce 0.4s ease-in-out infinite;
      }
      #loading-icon-shadow {
        width: 24px;
        height: 5px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.5);
        filter: blur(1px);
        animation: loading-icon-shadow 0.4s ease-in-out infinite;
      }
      @keyframes loading-icon-bounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes loading-icon-shadow {
        0%, 100% {
          transform: scaleX(1);
          opacity: 0.5;
        }
        50% {
          transform: scaleX(0.7);
          opacity: 0.3;
        }
      }
      #loading-bottom {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #loading-bar {
        width: min(220px, 60vw);
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #loading-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00e5ff, #ff2e9a);
        transition: width 0.2s ease;
      }
      #loading-pct {
        font: 0.75rem system-ui, sans-serif;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="loading-overlay">
        <div id="loading-walk-area">
          <div id="loading-walk-sprite">
            <img id="loading-icon-img" src="" alt="" />
            <div id="loading-icon-shadow"></div>
          </div>
        </div>
        <div id="loading-bottom">
          <div id="loading-bar"><div id="loading-bar-fill"></div></div>
          <div id="loading-pct">0%</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game-wrapper.ts"></script>
  </body>
</html>
